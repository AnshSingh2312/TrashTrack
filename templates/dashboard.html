<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | TrashTrack</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <header>    
    <h1>TrashTrack</h1>
    <nav>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('about') }}">About Us</a>
      <a href="{{ url_for('help') }}">Help</a>
      <a href="{{ url_for('notifications') }}">Notifications</a>
      <a href="{{ url_for('index') }}">Logout</a>
    </nav>
  </header>

  <h1>Dashboard</h1>
  <main class="dashboard-container">
    <div class="dashboard-box" onclick="window.location.href='{{ url_for('my_challans') }}'">
      <h3>My Challans</h3>
    </div>

    <div class="dashboard-box" onclick="window.location.href='{{ url_for('incident_report') }}'">
      <h3>Report an Incident</h3>
    </div>

    <div class="dashboard-box" onclick="window.location.href='{{ url_for('report_status') }}'">
      <h3>View Incident Status</h3>
    </div>

    <div class="dashboard-box" onclick="window.location.href='{{ url_for('grievance') }}'">
      <h3>Grievance</h3>
    </div>

    <div class="dashboard-box" onclick="window.location.href='{{ url_for('profile') }}'">
      <h3>User Profile</h3>
    </div>

    <div class="dashboard-box" onclick="window.location.href='{{ url_for('rewards') }}'">
      <h3>My Rewards</h3>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
